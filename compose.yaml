services:
  dashboard:
    build: .
    ports:
      - "9999:9999"
    volumes:
      - ./var:/app/var
    environment:
      TEACHERHELPER_MCP_API_KEY: ${TEACHERHELPER_MCP_API_KEY:-}
      SOLUTION_RUNNER_DASHBOARD_USER: ${SOLUTION_RUNNER_DASHBOARD_USER:-owner}
      SOLUTION_RUNNER_DASHBOARD_PASSWORD: ${SOLUTION_RUNNER_DASHBOARD_PASSWORD:-}
      SOLUTION_RUNNER_DASHBOARD_TOKEN: ${SOLUTION_RUNNER_DASHBOARD_TOKEN:-}
