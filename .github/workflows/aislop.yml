name: AISlop quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  aislop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff
      - run: npm ci --no-audit --no-fund
      - run: npm run quality:aislop
